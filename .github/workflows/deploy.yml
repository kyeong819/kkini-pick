name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify Pages build output
        run: test -s dist/index.html
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist
      - name: Verify Pages artifact upload
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [ -z "$PAGES_ARTIFACT_ID" ]; then
            echo "::error::The github-pages artifact upload returned no artifact ID."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
